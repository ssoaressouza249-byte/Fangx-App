name: Build Android APK (Blindado)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/settings.gradle.kts" ] || [ -f "temp_extract/build.gradle.kts" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Auto-Fix & Clean Project Conflicts
        run: |
          if [ -d "app/src/main/java/com/raylan" ] && [ -d "app/src/main/java/com/example" ]; then
            echo "Removendo pacote duplicado com/example..."
            rm -rf app/src/main/java/com/example
          fi

          rm -rf app/src/test app/src/androidTest

          # Limpa plugins extras do build.gradle.kts raiz
          if [ -f "build.gradle.kts" ]; then
            sed -i '/google-services/d' build.gradle.kts
            sed -i '/secrets-gradle-plugin/d' build.gradle.kts
          fi

          # Reescreve app/build.gradle.kts limpo e sem chaves quebradas
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
          }

          android {
              namespace = "com.raylan.fangx"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.raylan.fangx"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.ui)
              implementation(libs.androidx.ui.graphics)
              implementation(libs.androidx.ui.tooling.preview)
              implementation(libs.androidx.material3)
              implementation("androidx.compose.material:material-icons-extended:1.7.8")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/compileSdk = "[0-9]*"/compileSdk = "36"/g' gradle/libs.versions.toml
            sed -i 's/targetSdk = "[0-9]*"/targetSdk = "36"/g' gradle/libs.versions.toml
          fi

          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug -x lint --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fangx-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
